name: Build SensiAura1 iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Extract iOS source
        run: unzip -q 3105-iOS27-source-update.zip -d source
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project source/3105-main-src/ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/.derivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          APP_PATH=".derivedData/Build/Products/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qr 3105-iOS27-unsigned.ipa Payload)
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensiAura1-iOS-unsigned
          path: build/3105-iOS27-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
