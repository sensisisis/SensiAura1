name: Temporary 3105 build with Xcode 27.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.0
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Extract original source archive
        run: unzip -q 3105-iOS27-source-update.zip -d source
      - name: Compile original project without signing
        run: |
          mkdir -p build/App
          xcodebuild \
            -project source/3105-main-src/ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/App" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          test -d build/App/3105.app
