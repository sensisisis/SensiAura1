name: Temporary 3105 IPA with Xcode 27.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-package:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.0 and verify SDK
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK"
          test "$SDK" = "27.0"
      - name: Extract original source archive
        run: unzip -q 3105-iOS27-source-update.zip -d source
      - name: Build unsigned iOS app
        run: |
          mkdir -p build/App
          xcodebuild \
            -project source/3105-main-src/ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/App" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/App/3105.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qr 3105-iOS27.0-unsigned.ipa Payload)
          unzip -t build/3105-iOS27.0-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-iOS27.0-unsigned
          path: build/3105-iOS27.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
