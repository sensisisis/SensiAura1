name: Build 3105
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.0
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Verify SDK
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Detected iPhoneOS SDK: $SDK"
          test "$SDK" = "27.0"
